[package]
name = "nucleus-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nucleus-coop"
path = "src/main.rs"

[[bin]]
name = "elevator"
path = "src/bin/elevator.rs"

[dependencies]
nucleus-common = { workspace = true }
nucleus-engine = { workspace = true }
nucleus-script = { workspace = true }
nucleus-ui = { workspace = true }
nucleus-input = { workspace = true }
nucleus-platform = { workspace = true }
nucleus-tools = { workspace = true }
nucleus-profile = { workspace = true }
nucleus-hub = { workspace = true }
nucleus-plugin = { workspace = true }
nucleus-debug = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
gpui = { workspace = true }
gpui-platform = { workspace = true }
gpui-kit-assets = { workspace = true }

[target.'cfg(windows)'.dependencies]
nucleus-platform-windows = { workspace = true }
winreg = { workspace = true }
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nucleus-platform-linux = { workspace = true }
